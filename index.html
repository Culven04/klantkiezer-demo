<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KlantKiezer | Culven demo</title><style>body{margin:0;background:#f5f2ec;color:#192a35;font:17px system-ui,sans-serif}header{background:#172635;color:white;padding:25px;text-align:center}main{max-width:580px;margin:32px auto;padding:26px;background:white;border-radius:18px;box-shadow:0 5px 30px #0001}h1{font-size:30px}button{display:block;width:100%;margin:12px 0;padding:17px;border:1px solid #c9c9c9;background:#fafafa;border-radius:12px;text-align:left;font-size:17px;cursor:pointer}button:hover{background:#eee6d8}.primary{background:#172635;color:white;text-align:center}small{color:#666}footer{text-align:center;padding:20px}@media(max-width:650px){main{margin:12px;padding:20px}}</style></head><body><header><strong>CULVEN</strong><p>KlantKiezer - interactieve demonstratie</p></header><main><small id="progress">Vraag 1 van 3</small><h1 id="question"></h1><div id="choices"></div></main><footer><small>Conceptdemo door Culven. Geen echte AI of betalingen.</small></footer><script>const q=[['Wie wil je met jouw bedrijf het liefst helpen?','Particuliere klanten','Ondernemers en bedrijven','Een specifieke doelgroep'],['Wat vindt jouw ideale klant belangrijk?','Kwaliteit en betrouwbaarheid','Persoonlijke aandacht','Prijs en gemak'],['Wat wil je dat jouw klant bereikt?','Tijd besparen','Meer resultaat behalen','Een probleem oplossen']];let i=0,a=[];function show(){document.querySelector('#progress').textContent='Vraag '+(i+1)+' van 3';document.querySelector('#question').textContent=q[i][0];document.querySelector('#choices').innerHTML='';q[i].slice(1).forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{a.push(v);i++;i<3?show():done()};document.querySelector('#choices').append(b)})}function done(){document.querySelector('#progress').textContent='Jouw eerste inzicht';document.querySelector('#question').textContent='Jouw ideale klant';document.querySelector('#choices').innerHTML='<p><b>Doelgroep:</b> '+a[0]+'</p><p><b>Belangrijk:</b> '+a[1]+'</p><p><b>Gewenst resultaat:</b> '+a[2]+'</p>';let b=document.createElement('button');b.className='primary';b.textContent='Opnieuw beginnen';b.onclick=()=>{i=0;a=[];show()};document.querySelector('#choices').append(b)}show()</script></body></html>
